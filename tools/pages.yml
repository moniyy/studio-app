# Publishes the app to GitHub Pages and writes config.js from repository
# secrets (SUPABASE_URL, SUPABASE_ANON_KEY) — the keys never live in the repo.
# Without the secrets config.js is empty and the app runs without a backend
# (demo masters and external booking links still work).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node -e '
            const u = process.env.SUPABASE_URL || "", k = process.env.SUPABASE_ANON_KEY || "";
            const cfg = u && k ? { supabaseUrl: u, supabaseAnonKey: k } : {};
            require("fs").writeFileSync("config.js", "/* generated by .github/workflows/pages.yml */\nwindow.STUDIO_CONFIG = " + JSON.stringify(cfg) + ";\n");
            console.log(u && k ? "config.js: Supabase " + u : "config.js: no backend (secrets not set)");
          '

      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html app.css app.js backend.js cabinet.js config.js sw.js manifest.json img masters _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
