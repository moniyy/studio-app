<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio App</title>
  <!-- Pretty links: GitHub Pages answers /studio-app/bella-brows with this page.
       It hands over to the app as ?m=bella-brows (the app then shows the pretty
       address again). On a domain of its own (satinbook.com/bella-brows) the same. -->
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      // /<repo>/<slug> on github.io, /<slug> on a domain
      var root = parts.length > 1 ? '/' + parts[0] + '/' : '/';
      var slug = (parts.length > 1 ? parts[1] : parts[0] || '').toLowerCase();
      if (!/^[a-z0-9][a-z0-9_-]{0,60}$/.test(slug)) { location.replace(root); return; }
      var q = location.search.replace(/^\?/, '');
      location.replace(root + '?m=' + encodeURIComponent(slug) + (q ? '&' + q : '') + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5F2; color: #1C1A19;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0E0E11; color: #F4F4F5; } }
  </style>
</head>
<body><p>Opening…</p></body>
</html>
