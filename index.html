<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Studio App</title>

  <meta name="theme-color" content="#F7F5F2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Studio">
  <meta name="format-detection" content="telephone=no">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" href="./img/icon-192.png">
  <link rel="apple-touch-icon" href="./img/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="./app.css">

  <!-- GSAP drives the spring animations (deferred: it runs before app init) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" defer></script>
  <!-- Loaded in <head> on purpose: the first lines apply saved theme / accent / text size before the first paint. -->
  <script src="./app.js"></script>
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="app is-splash" id="app">

        <!-- Everything that shrinks back when a bottom sheet opens -->
        <div class="shell" id="shell">

        <!-- Slowly drifting accent "mesh" behind everything -->
        <div class="mesh" aria-hidden="true"><i></i><i></i><i></i></div>


        <main class="views" id="views">
          <section class="view view--home" data-view="home" hidden></section>
          <section class="view" data-view="services" hidden></section>
          <section class="view view--chat" data-view="ask" hidden></section>
          <section class="view" data-view="gallery" hidden></section>
          <section class="view" data-view="more" hidden></section>
        </main>

        <!-- Pushed screen (Policies / Aftercare / Hours) -->
        <section class="view view--sub" id="subview" hidden></section>

        <!-- Floating "liquid glass" tab bar -->
        <nav class="tabbar glass" id="tabbar" role="tablist" aria-label="Main">
          <i class="tabbar__pill" aria-hidden="true"></i>
          <button class="tab" role="tab" data-tab="home">
            <span class="tab__icon">
              <svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
              <svg class="i-fill" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z"/></svg>
            </span>
            <span class="tab__label">Home</span>
          </button>
          <button class="tab" role="tab" data-tab="services">
            <span class="tab__icon">
              <svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5l1.8 4.9 4.9 1.8-4.9 1.8L10 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z"/><path d="M18 15.5v5M15.5 18h5"/></svg>
              <svg class="i-fill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3.5l1.8 4.9 4.9 1.8-4.9 1.8L10 16.9l-1.8-4.9-4.9-1.8 4.9-1.8z" fill="currentColor"/><path d="M18 15.5v5M15.5 18h5" stroke-width="2.2"/></svg>
            </span>
            <span class="tab__label">Services</span>
          </button>
          <button class="tab" role="tab" data-tab="ask">
            <span class="tab__icon">
              <svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.8a8.3 8.3 0 0 1-12.2 7.3L3.5 20.5l1.4-4.6a8.3 8.3 0 1 1 15.6-4.1z"/></svg>
              <svg class="i-fill" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20.5 11.8a8.3 8.3 0 0 1-12.2 7.3L3.5 20.5l1.4-4.6a8.3 8.3 0 1 1 15.6-4.1z"/></svg>
            </span>
            <span class="tab__label">Ask</span>
          </button>
          <button class="tab" role="tab" data-tab="gallery">
            <span class="tab__icon">
              <svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="16" rx="4"/><circle cx="9" cy="9.5" r="1.5"/><path d="m20.5 15-4-4L7 20"/></svg>
              <svg class="i-fill" viewBox="0 0 24 24"><defs><mask id="tm-gal"><rect width="24" height="24" fill="#fff"/><circle cx="9" cy="9.5" r="1.8" fill="#000"/><path d="m21 15-4.5-4.5L6.5 20.5" stroke="#000" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"/></mask></defs><rect x="3" y="3.5" width="18" height="17" rx="4.5" fill="currentColor" mask="url(#tm-gal)"/></svg>
            </span>
            <span class="tab__label">Looks</span>
          </button>
          <button class="tab" role="tab" data-tab="more">
            <span class="tab__icon">
              <svg class="i-line" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8 12h.01M12 12h.01M16 12h.01" stroke-width="2.4"/></svg>
              <svg class="i-fill" viewBox="0 0 24 24"><defs><mask id="tm-more"><rect width="24" height="24" fill="#fff"/><circle cx="8" cy="12" r="1.3" fill="#000"/><circle cx="12" cy="12" r="1.3" fill="#000"/><circle cx="16" cy="12" r="1.3" fill="#000"/></mask></defs><circle cx="12" cy="12" r="9.4" fill="currentColor" mask="url(#tm-more)"/></svg>
            </span>
            <span class="tab__label">More</span>
          </button>
        </nav>

        </div><!-- /shell -->

        <!-- Fake status bar, only shown inside the desktop phone frame -->
        <div class="statusbar" aria-hidden="true">
          <span id="sb-time">9:41</span>
          <i class="statusbar__island"></i>
          <span class="statusbar__icons">
            <svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
            <svg viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2" fill="currentColor"/><path d="M24 4.5v4c.8-.3 1.5-1 1.5-2s-.7-1.7-1.5-2z" fill="currentColor" opacity=".5"/></svg>
          </span>
        </div>

        <!-- Sheet backdrop -->
        <div class="scrim" id="scrim"></div>

        <!-- Universal bottom sheet (service details, booking) -->
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
          <div class="sheet__grab" aria-hidden="true"><i></i></div>
          <div class="sheet__content"></div>
        </section>

        <!-- Stories viewer -->
        <div class="stories" id="stories" hidden>
          <div class="stories__stage">
            <img class="stories__img" alt="">
            <div class="stories__shade"></div>
            <div class="stories__bars"></div>
            <header class="stories__head">
              <img class="stories__avatar" alt="">
              <span class="stories__title"></span>
              <span class="stories__count"></span>
              <button class="stories__close" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
              </button>
            </header>
            <div class="stories__foot is-empty"></div>
          </div>
        </div>

        <!-- Notification popover -->
        <div class="notice" id="notice" hidden>
          <div class="notice__card glass" role="status"></div>
        </div>

        <!-- Fullscreen photo viewer -->
        <div class="lightbox" id="lightbox" hidden>
          <div class="lightbox__bg"></div>
          <div class="lightbox__track"></div>
          <button class="lightbox__close" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <div class="lightbox__bar">
            <div class="lightbox__count"></div>
            <button class="lightbox__like" aria-label="Like" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            </button>
          </div>
        </div>

        <div class="toast glass" id="toast" role="status" aria-live="polite"></div>

        <div class="splash" id="splash">
          <div class="splash__inner"></div>
        </div>

      </div>
    </div>

    <!-- Shown next to the phone frame on desktop -->
    <aside class="desk">
      <span class="desk__eyebrow">Studio App</span>
      <h2 class="desk__title">Open on your phone to install</h2>
      <div class="desk__qr" id="qr"></div>
      <p class="desk__hint">Scan the code with your camera, then tap Share → Add to Home Screen.</p>
    </aside>
  </div>
</body>
</html>
