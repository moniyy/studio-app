# Weekly database backup → the private repository moniyy/satinbook-backups.
# roles.sql + schema.sql + data.sql (gzip) in a folder per date; only the last 8 are kept
# (the repository is rewritten to a single commit each time, so old copies are really gone).
# The dump connects as the read-only role satinbook_backup (secret SUPABASE_BACKUP_DB_URL)
# and pushes with a deploy key that can write only to that one repository (secret BACKUP_DEPLOY_KEY).
# Restore: README → "Резервные копии".
name: Weekly database backup

on:
  schedule:
    - cron: '41 6 * * 0'   # Sundays, 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump roles, schema and data
        env:
          DB_URL: ${{ secrets.SUPABASE_BACKUP_DB_URL }}
        run: |
          d=$(date -u +%Y-%m-%d)
          mkdir -p "dump/$d"
          supabase db dump --db-url "$DB_URL" --role-only -f "dump/$d/roles.sql"
          supabase db dump --db-url "$DB_URL" -f "dump/$d/schema.sql"
          supabase db dump --db-url "$DB_URL" --data-only --use-copy -f "dump/$d/data.sql"
          # an empty data file means something went wrong
          test "$(wc -c < "dump/$d/data.sql")" -gt 1000
          gzip -9 dump/$d/*.sql
          ls -la "dump/$d"
          echo "DAY=$d" >> "$GITHUB_ENV"

      - name: Save to moniyy/satinbook-backups (keep the last 8)
        env:
          KEY: ${{ secrets.BACKUP_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$KEY" > ~/.ssh/backup_key && chmod 600 ~/.ssh/backup_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/backup_key -o IdentitiesOnly=yes"
          git clone --depth 1 git@github.com:moniyy/satinbook-backups.git repo
          rm -rf "repo/$DAY" && cp -r "dump/$DAY" "repo/$DAY"
          cd repo
          ls -d 20??-??-??/ 2>/dev/null | sort | head -n -8 | xargs -r rm -rf
          printf '# satinbook.com — database backups\n\nOne folder per week (UTC date), the last 8 only: roles.sql.gz, schema.sql.gz, data.sql.gz.\nHow to restore: README of moniyy/studio-app → "Резервные копии".\n\nKept now:\n' > README.md
          ls -d 20??-??-??/ | sort -r | sed 's#/##; s#^#- #' >> README.md
          git config user.name "satinbook-backup" && git config user.email "backup@satinbook.com"
          git checkout -q --orphan fresh && git add -A && git commit -q -m "Backups up to $DAY"
          git push -q -f origin fresh:main
          echo "saved $DAY; kept: $(ls -d 20??-??-??/ | wc -l)"
          rm -f ~/.ssh/backup_key

      - name: Open an issue when it failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Weekly backup failed — ${new Date().toISOString().slice(0, 10)}`,
              body: `The weekly database backup didn't finish.\n\n- Run: ${run}\n- The previous copies in moniyy/satinbook-backups are untouched.`
            });
