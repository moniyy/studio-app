<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Satinbook</title>
  <!-- Pretty links: GitHub Pages answers satinbook.com/bella-brows with this page.
       It hands over to the app (app.html?m=bella-brows; the app then shows the pretty
       address again). On <user>.github.io the app lives under /<repo>/. -->
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var ok = /^[a-z0-9][a-z0-9_-]{0,60}$/;
      // a project page on github.io: /<repo>/<slug>; a domain of its own: /<slug>
      // (an old /studio-app/<slug> path on the domain still finds the studio: its last part)
      var root = /\.github\.io$/.test(location.hostname) && parts.length > 1 ? '/' + parts[0] + '/' : '/';
      var slug = (root === '/' ? parts[parts.length - 1] : parts[1] || '') || '';
      slug = slug.toLowerCase();
      if (!ok.test(slug)) { location.replace(root); return; }
      var q = location.search.replace(/^\?/, '');
      location.replace(root + 'app.html?m=' + encodeURIComponent(slug) + (q ? '&' + q : '') + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #F7F5F2; color: #1C1A19;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    @media (prefers-color-scheme: dark) { body { background: #0E0E11; color: #F4F4F5; } }
  </style>
</head>
<body><p>Opening…</p></body>
</html>
