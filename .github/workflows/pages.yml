# Publishes the app to GitHub Pages and writes config.js from repository
# secrets (SUPABASE_URL, SUPABASE_ANON_KEY) — the keys never live in the repo.
# Without the secrets config.js is empty and the app runs without a backend
# (demo masters and external booking links still work).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          # where every link points (emails, QR cards, Welcome kit): repository variable APP_BASE_URL,
          # else the domain in CNAME, else this GitHub Pages address
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          node -e '
            const u = process.env.SUPABASE_URL || "", k = process.env.SUPABASE_ANON_KEY || "";
            const cfg = u && k ? { supabaseUrl: u, supabaseAnonKey: k } : {};
            if (cfg.supabaseUrl && process.env.VAPID_PUBLIC_KEY) cfg.vapidPublicKey = process.env.VAPID_PUBLIC_KEY;
            const fs = require("fs");
            const cname = fs.existsSync("CNAME") ? fs.readFileSync("CNAME", "utf8").trim() : "";
            cfg.baseUrl = (process.env.APP_BASE_URL || (cname ? "https://" + cname + "/" : process.env.PAGES_URL)).replace(/\/?$/, "/");
            require("fs").writeFileSync("config.js", "/* generated by .github/workflows/pages.yml */\nwindow.STUDIO_CONFIG = " + JSON.stringify(cfg) + ";\n");
            console.log((u && k ? "config.js: Supabase " + u : "config.js: no backend (secrets not set)") + " · links: " + cfg.baseUrl);
          '

      - name: Collect the site
        run: |
          mkdir _site
          # index.html + landing.* = the product page (satinbook.com); app.html = the app itself
          cp -r index.html landing.css landing.js app.html 404.html app.css app.js backend.js cabinet.js admin.js config.js sw.js manifests img masters _site/
          # a domain of its own (README → "Switch to satinbook.com")
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
